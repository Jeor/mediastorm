name: Publish admin workspace test image

on:
  workflow_dispatch:
  push:
    branches: [build/admin-workspace-image]
    paths:
      - backend/**
      - Dockerfile.admin-workspace
      - .github/workflows/publish-admin-redesign-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-admin-workspace-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jeor/mediastorm
          tags: |
            type=raw,value=admin-workspace
            type=sha,prefix=admin-workspace-build-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.admin-workspace
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published manifest
        run: docker buildx imagetools inspect ghcr.io/jeor/mediastorm:admin-workspace
